<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TK Advocate — Admin Control Center</title>
<style>
:root{--bg:#07090c;--panel:#0f1318;--panel2:#141a21;--line:#232b34;--text:#f1ede3;--muted:#8b95a1;--gold:#d7b36a;--gold2:#f0d59a;--red:#ef6b6b;--green:#4fd49a;--blue:#6aaeff}
*{box-sizing:border-box}html,body{margin:0}body{background:radial-gradient(1100px 500px at 10% -10%,#1b222b 0,transparent 60%),var(--bg);color:var(--text);font:14px/1.55 "Segoe UI",Arial,sans-serif;min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}.hidden{display:none!important}.small{font-size:12px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--panel2);padding:9px 14px;border-radius:10px;cursor:pointer;transition:.15s;font-weight:600;font-size:13px}.btn:hover{border-color:#4a5561;transform:translateY(-1px)}
.btn.primary{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#17130b;border-color:var(--gold)}.btn.danger{color:#ffb1b1;border-color:#5a3030}.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
input,textarea,select{width:100%;background:#0a0d11;border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:0}input:focus,textarea:focus,select:focus{border-color:var(--gold)}textarea{min-height:92px;resize:vertical}
.field{display:grid;gap:6px;margin:11px 0}.field label{font-size:11px;letter-spacing:.08em;color:var(--muted);font-weight:700}
#login{min-height:100vh;display:grid;place-items:center;padding:20px}.lcard{width:100%;max-width:420px;background:linear-gradient(180deg,#121820,#0d1116);border:1px solid var(--line);border-radius:20px;padding:30px;box-shadow:0 30px 80px #000a}
.mark{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:26px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#17130b;margin-bottom:14px}.lcard h1{margin:0 0 4px;font-size:25px}
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
aside{background:linear-gradient(180deg,#0d1116,#0a0d11);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;gap:11px;align-items:center;padding:4px 8px 18px}.brand .mark{width:42px;height:42px;font-size:20px;margin:0;border-radius:12px}.brand b{display:block;font-size:15px}.brand span{font-size:10px;letter-spacing:.12em;color:var(--muted)}
.nav button{width:100%;text-align:left;background:none;border:1px solid transparent;padding:11px 12px;border-radius:11px;cursor:pointer;color:var(--muted);display:flex;gap:11px;align-items:center;font-weight:600}.nav button i{font-style:normal;width:20px;text-align:center;color:var(--gold)}
.nav button:hover{background:#12171d;color:var(--text)}.nav button.on{background:linear-gradient(90deg,#251f10,#14171c);border-color:#4b3f22;color:var(--gold2)}
.side-bottom{margin-top:auto;display:grid;gap:8px}.me{background:#10151b;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12px;color:var(--muted);word-break:break-all}
main{padding:26px 30px 60px;min-width:0}.head{display:flex;justify-content:space-between;gap:14px;align-items:flex-end;flex-wrap:wrap;margin-bottom:22px}.head h2{margin:0;font-size:26px}.head p{margin:3px 0 0;color:var(--muted)}.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--gold);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:20px}.stat{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:18px;cursor:pointer;transition:.15s}.stat:hover{border-color:#4b3f22;transform:translateY(-2px)}.stat small{color:var(--muted);letter-spacing:.08em;font-weight:700;font-size:11px}.stat b{display:block;font-size:32px;margin-top:6px;color:var(--gold2)}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:18px}.card h3{margin:0 0 4px;font-size:16px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.bar input{flex:1;min-width:200px}.bar select{width:auto}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px}table{width:100%;border-collapse:collapse;min-width:640px}th{font-size:11px;letter-spacing:.08em;color:var(--muted);text-align:left;padding:11px 14px;background:#0c1015;border-bottom:1px solid var(--line)}td{padding:12px 14px;border-bottom:1px solid #1a2129;vertical-align:top}tr:last-child td{border:0}tr:hover td{background:#10151b}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700;border:1px solid var(--line);background:#10161c;color:var(--gold2)}.tag.ok{color:var(--green);border-color:#1e4a38}.tag.bad{color:var(--red);border-color:#5a3030}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.chip{display:inline-flex;gap:8px;align-items:center;padding:6px 8px 6px 12px;border-radius:99px;background:#10161c;border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--gold2)}.chip button{border:0;background:#2a1b1b;color:#ffb1b1;border-radius:50%;width:20px;height:20px;cursor:pointer;line-height:1}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}.check{display:flex;gap:9px;align-items:center;background:#0b0f13;border:1px solid var(--line);padding:9px 11px;border-radius:10px}.check input{width:auto}
.mbk{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:16px;z-index:50}.modal{width:100%;max-width:620px;max-height:92vh;overflow:auto;background:#0f1419;border:1px solid #3a3322;border-radius:20px;padding:24px;box-shadow:0 30px 90px #000}.modal h3{margin:0 0 6px;font-size:19px}.macts{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:8px 12px;margin-top:12px}.kv b{color:var(--muted);font-size:12px;letter-spacing:.06em}.kv span{word-break:break-all}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(30px);background:#17130b;border:1px solid var(--gold);color:var(--gold2);padding:11px 20px;border-radius:12px;opacity:0;transition:.25s;z-index:99;pointer-events:none}#toast.show{opacity:1;transform:translateX(-50%)}
.empty{padding:34px;text-align:center;color:var(--muted)}.note{background:#17130b;border:1px solid #4b3f22;color:#dccb9f;padding:12px 14px;border-radius:12px;margin:12px 0;font-size:13px}
@media(max-width:900px){.shell{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;padding:12px}.brand{padding:0 8px 0 0}.nav{display:flex;gap:6px;overflow-x:auto;width:100%}.nav button{width:auto;white-space:nowrap}.side-bottom{flex-direction:row;margin:0;width:100%}main{padding:18px 14px 60px}.grid2{grid-template-columns:1fr}}
.fsrow{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;background:#0b0f13}.fshead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.fshead .check{border:0;background:none;padding:0}.fsmonthly{display:flex;align-items:center;gap:8px}.fsmonthly input{width:130px}.fsdurs{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-top:12px}.fsd{display:grid;gap:6px}.fsd .check{padding:7px 10px}
.fsrow{border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px;background:linear-gradient(180deg,#10151b,#0b0f13);transition:.2s}.fsrow.hot{border-color:#5b4a22;box-shadow:0 14px 34px #0006}
.fsti{display:flex;gap:12px;align-items:center}.fsti i{font-style:normal;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:20px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#17130b;flex:none}.fsti b{display:block;font-size:15px}
.fsopts{display:flex;gap:18px;flex-wrap:wrap}.sw{display:flex;align-items:center;gap:9px;cursor:pointer;font-size:12px;font-weight:700;color:var(--muted)}.sw input{display:none}.sw span{width:40px;height:22px;border-radius:99px;background:#222a33;position:relative;transition:.2s;flex:none}.sw span:after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#8b95a1;transition:.2s}.sw input:checked+span{background:#6b5628}.sw input:checked+span:after{left:21px;background:var(--gold2)}
</style></head><body>
<div id="login"><div class="lcard"><div class="mark">⚖</div><div class="eyebrow">PRIVATE ADMINISTRATION</div><h1>TK Advocate Admin</h1><p class="small">Sign in with your administrator account. Changes go live on the website instantly.</p>
<div class="field"><label>ADMIN EMAIL</label><input id="email" type="email" placeholder="admin@example.com" autocomplete="username"></div>
<div class="field"><label>ADMIN PASSWORD</label><input id="pass" type="password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"></div>
<button class="btn primary" style="width:100%;padding:12px" onclick="login()">ENTER ADMIN PANEL</button><div id="err" class="small" style="margin-top:12px;min-height:18px"></div></div></div>
<div id="app" class="shell hidden"><aside><div class="brand"><div class="mark">⚖</div><div><b>TK Advocate</b><span>ADMIN CONTROL</span></div></div><nav class="nav" id="nav"></nav>
<div class="side-bottom"><div class="me" id="me"></div><button class="btn danger" onclick="logout()">LOGOUT</button></div></aside><main id="main"></main></div>
<div id="toast"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut,updatePassword} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,deleteDoc,collection,getDocs} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyChp6gzh6dCcd12VJ_Ecfd7IAQS-1DTGY4",authDomain:"advocate-40077.firebaseapp.com",databaseURL:"https://advocate-40077-default-rtdb.firebaseio.com",projectId:"advocate-40077",storageBucket:"advocate-40077.firebasestorage.app",messagingSenderId:"759844757207",appId:"1:759844757207:web:c320df4a4401f180bf1a92"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),fs=getFirestore(app);
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function fbErr(e){const m={'auth/invalid-credential':'Wrong email or password.','auth/wrong-password':'Wrong email or password.','auth/user-not-found':'No account found for this email.','auth/invalid-email':'Enter a valid email address.','auth/too-many-requests':'Too many attempts. Try again later.','auth/network-request-failed':'Network error. Check your internet.','auth/requires-recent-login':'Please logout and login again, then retry.','permission-denied':'Permission denied by Firestore rules.'};const c=e&&(e.code||'')||'';return m[c]||(e&&e.message)||'Something went wrong.'}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(window.__t);window.__t=setTimeout(()=>e.classList.remove('show'),2400)}
const fd=n=>n?new Date(n).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}):'—';
const DEFAULT_CATS=['CIVIL','PROPERTY','FAMILY','CRIMINAL','COMMERCIAL','CONSUMER','CYBER','MOTOR','PUBLIC LAW','PRACTICE','ENVIRONMENT','IPR','INDEX'];
const FEATURES={dashboard:'Dashboard',assistant:'Legal Assistant',cases:'My Cases',clients:'Clients',hearings:'Hearings & Dates',documents:'Documents',drafting:'Drafting Desk',library:'Law Library',judgments:'Judgments',updates:'Law Updates',notes:'Practice Notes',reports:'Reports',charts:'Charts',profile:'My Profile',settings:'Settings',fees:'Fees & Payments',plans:'Plans & Subscription'};
const SITE_DEF={brand:{name:'TK Advocate Panel',subtitle:'Professional Legal Practice Workspace',welcome:'A professional control room for your legal office.'},theme:{accent:'#d7b36a',background:'#0b0e12'},quick:{cases:'Manage Case Register',documents:'Open Checklists',judgments:'Research Judgments',notes:'Add Practice Note'},assistant:{enabled:true,intro:'Start with facts and documents before drafting.'}};
let PAY=[],SUBS={},U=[],BL=new Set(),CFG={},D={library:{categories:[],items:[]},judgments:{items:[]},updates:{items:[]},plans:{items:[]},payment:{},featureSub:{items:{}}},view='dashboard',me=null;
const CLD={cloud:'pbuaovhk',preset:'advocate_unsigned'};let UPLOADING=0;
const NAV=[['dashboard','⌂','Dashboard'],['users','♙','Users'],['library','▣','Law Library'],['judgments','◉','Judgments'],['updates','◇','Law Updates'],['push','🔔','Notifications'],['plans','◈','Plans'],['featsub','★','Premium Access'],['payments','₹','Payments'],['site','⚙','Website Settings'],['security','🔒','Security']];
const COLL={
 plans:{title:'Subscription Plans',single:'Plan',fields:[['name','Plan name','text',1],['price','Price (₹) — 0 for free plan','text'],['days','Validity (days)','text'],['maxCases','Max cases (blank = unlimited)','text'],['features','Features (one per line)','area'],['badge','Badge on plan card (e.g. MOST POPULAR)','text'],['unlock','This plan unlocks (access)','feats']],cols:[['name','PLAN'],['price','PRICE ₹'],['days','DAYS'],['unlock','UNLOCKS']]},
 library:{title:'Law Library Entries',single:'Law / Book',fields:[['t','Title (Act / Book name)','text',1],['c','Category','cat'],['d','Description','area'],['th','Cover image (thumbnail)','img'],['e','E-book PDF (upload, or paste a link)','pdf'],['p','Subscription access (Premium = locked)','sel',['Default','Premium','Free']]],cols:[['t','TITLE'],['c','CATEGORY'],['e','E-BOOK'],['p','ACCESS']]},
 judgments:{title:'Published Judgments',single:'Judgment',fields:[['caseName','Case name / citation','text',1],['court','Court','text'],['date','Date','date'],['topic','Topic','text'],['ratio','Proposition / summary','area'],['source','Source / link','text']],cols:[['caseName','CASE'],['court','COURT'],['date','DATE']]},
 updates:{title:'Published Law Updates',single:'Law Update',fields:[['title','Title','text',1],['category','Category','sel',['Amendment','Notification','Judgment Alert','Practice Direction','Other']],['date','Date','date'],['details','Details','area'],['source','Source / Gazette link','text']],cols:[['title','TITLE'],['category','CATEGORY'],['date','DATE']]}
};
async function login(){const em=$('email').value.trim(),p=$('pass').value;if(!em||!p){$('err').textContent='Enter admin email and password.';return}$('err').textContent='Connecting…';try{await signInWithEmailAndPassword(auth,em,p)}catch(e){$('err').textContent=fbErr(e)}}
async function enter(user){let ok=false;try{const d=await getDoc(doc(fs,'admins',user.uid));ok=d.exists()&&d.data().role==='admin'}catch(e){}
 if(!ok){await signOut(auth);$('err').innerHTML='This account is not an administrator. In Firestore add document <b>admins / '+esc(user.uid)+'</b> with field <b>role</b> = admin';return}
 me=user;$('me').textContent=user.email;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('nav').innerHTML=NAV.map(n=>`<button data-v="${n[0]}" onclick="go('${n[0]}')"><i>${n[1]}</i>${n[2]}</button>`).join('');await loadAll();go('dashboard')}
onAuthStateChanged(auth,u=>{if(u)enter(u)});
async function logout(){await signOut(auth);location.reload()}
async function loadAll(){
 try{const [pr,bl,cf,lb,jd,up,pa,sb,pl,pm,fsb]=await Promise.all([getDocs(collection(fs,'profiles')),getDocs(collection(fs,'blocked')),getDoc(doc(fs,'siteConfig','main')),getDoc(doc(fs,'content','library')),getDoc(doc(fs,'content','judgments')),getDoc(doc(fs,'content','updates')),getDocs(collection(fs,'payments')),getDocs(collection(fs,'subscriptions')),getDoc(doc(fs,'content','plans')),getDoc(doc(fs,'content','payment')),getDoc(doc(fs,'content','featureSub'))]);
 U=pr.docs.map(d=>({uid:d.id,...d.data()})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));BL=new Set(bl.docs.map(d=>d.id));
 const v=cf.exists()?cf.data():{};CFG={...v,brand:{...SITE_DEF.brand,...(v.brand||{})},theme:{...SITE_DEF.theme,...(v.theme||{})},quick:{...SITE_DEF.quick,...(v.quick||{})},assistant:{...SITE_DEF.assistant,...(v.assistant||{})},features:v.features||{},labels:v.labels||{}};
 const L=lb.exists()?lb.data():{};D.library={categories:L.categories||[],items:L.items||[]};D.judgments={items:jd.exists()?(jd.data().items||[]):[]};D.updates={items:up.exists()?(up.data().items||[]):[]};D.plans={items:pl.exists()?(pl.data().items||[]):[]};D.payment=pm.exists()?pm.data():{};D.featureSub={items:(fsb.exists()&&fsb.data().items)||{}};PAY=pa.docs.map(d=>({id:d.id,...d.data()})).sort((x,y)=>(y.createdAt||0)-(x.createdAt||0));SUBS={};sb.docs.forEach(d=>SUBS[d.id]=d.data());
 }catch(e){toast(fbErr(e))}}
function go(v){view=v;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));const m=$('main');
 m.innerHTML=({dashboard:pDash,users:pUsers,library:pLib,judgments:()=>pList('judgments'),updates:()=>pList('updates'),plans:pPlans,payments:pPay,featsub:pFeat,push:pPush,site:pSite,security:pSec})[v]();
 if(v==='users')drawUsers();if(v==='push')drawPush();if(v==='library'){drawList('library')}if(v==='judgments')drawList('judgments');if(v==='updates')drawList('updates');if(v==='plans')drawList('plans');scrollTo(0,0)}
const head=(t,p,btn='')=>`<div class="head"><div><div class="eyebrow">TK ADVOCATE ADMIN</div><h2>${t}</h2><p>${p}</p></div><div>${btn}</div></div>`;
function pDash(){const act=U.filter(u=>!BL.has(u.uid)).length;
 const st=[['TOTAL USERS',U.length,'users'],['ACTIVE USERS',act,'users'],['BLOCKED',BL.size,'users'],['LAW LIBRARY ENTRIES',D.library.items.length,'library'],['JUDGMENTS',D.judgments.items.length,'judgments'],['LAW UPDATES',D.updates.items.length,'updates'],['PENDING PAYMENTS',PAY.filter(p=>p.status==='pending').length,'payments'],['ACTIVE SUBSCRIBERS',Object.values(SUBS).filter(s=>s.validUntil>Date.now()||Object.values(s.feats||{}).some(t=>t>Date.now())).length,'payments']];
 return head('Control Center','Everything on the website is managed from here.')+`<div class="stats">${st.map(s=>`<div class="stat" onclick="go('${s[2]}')"><small>${s[0]}</small><b>${s[1]}</b></div>`).join('')}</div>
 <div class="grid2"><div class="card"><h3>Recent Users</h3><p class="small">Latest sign-ups on the website.</p>${U.slice(0,6).map(u=>`<div style="padding:10px 0;border-bottom:1px solid #1a2129"><b>${esc(u.name||'—')}</b><div class="small">${esc(u.email||'')} · ${esc(u.mobile||'no mobile')} · ${fd(u.createdAt)}</div></div>`).join('')||'<div class="empty">No users yet.</div>'}</div>
 <div class="card"><h3>Quick Actions</h3><p class="small">Publish content to the website instantly.</p><div style="display:grid;gap:10px;margin-top:12px"><button class="btn primary" onclick="go('library');setTimeout(()=>editItem('library',-1),50)">＋ Add Law / E-book</button><button class="btn" onclick="go('judgments');setTimeout(()=>editItem('judgments',-1),50)">＋ Add Judgment</button><button class="btn" onclick="go('updates');setTimeout(()=>editItem('updates',-1),50)">＋ Add Law Update</button><button class="btn" onclick="go('site')">⚙ Website Settings</button></div></div></div>`}
function pUsers(){return head('Users','Every registered website user — name, login ID, email and mobile.',`<button class="btn" onclick="exportUsers()">⇩ EXPORT CSV</button>`)+`<div class="card"><div class="bar"><input id="uq" placeholder="Search name, email, mobile, login ID…" oninput="drawUsers()"><select id="uf" onchange="drawUsers()"><option value="">All users</option><option value="a">Active</option><option value="b">Blocked</option></select></div><div class="tw" id="ut"></div><p class="small" style="margin-top:12px">Users appear here after they register and sign in on the website. Blocking stops a user from entering the website.</p></div>`}
window.drawUsers=()=>{const q=($('uq')?.value||'').toLowerCase(),f=$('uf')?.value||'';const rows=U.filter(u=>(!f||(f==='b')===BL.has(u.uid))&&[u.name,u.loginId,u.email,u.mobile].some(v=>String(v||'').toLowerCase().includes(q)));
 $('ut').innerHTML=rows.length?`<table><thead><tr><th>#</th><th>NAME</th><th>LOGIN ID</th><th>EMAIL</th><th>MOBILE</th><th>JOINED</th><th>PLAN</th><th>STATUS</th><th></th></tr></thead><tbody>${rows.map((u,i)=>`<tr><td>${i+1}</td><td><b>${esc(u.name||'—')}</b></td><td>${esc(u.loginId||'—')}</td><td>${esc(u.email||'—')}</td><td>${esc(u.mobile||'—')}</td><td>${fd(u.createdAt)}</td><td>${planCell(u.uid)}</td><td><span class="tag ${BL.has(u.uid)?'bad':'ok'}">${BL.has(u.uid)?'BLOCKED':'ACTIVE'}</span></td><td style="white-space:nowrap"><button class="btn sm" onclick="viewUser('${esc(u.uid)}')">View</button> <button class="btn sm ${BL.has(u.uid)?'':'danger'}" onclick="toggleBlock('${esc(u.uid)}')">${BL.has(u.uid)?'Unblock':'Block'}</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">No users found.</div>'}

window.toggleBlock=async uid=>{const b=BL.has(uid);if(!confirm(b?'Unblock this user?':'Block this user from the website?'))return;try{if(b){await deleteDoc(doc(fs,'blocked',uid));BL.delete(uid)}else{await setDoc(doc(fs,'blocked',uid),{blocked:true,at:Date.now()});BL.add(uid)}drawUsers();toast(b?'User unblocked.':'User blocked.')}catch(e){toast(fbErr(e))}};

function pList(n){const c=COLL[n];return head(c.title,'Add, edit or remove — visible to all website users instantly.',`<button class="btn primary" onclick="editItem('${n}',-1)">＋ ADD ${c.single.toUpperCase()}</button>`)+`<div class="card"><div class="bar"><input id="lq" placeholder="Search…" oninput="drawList('${n}')"></div><div class="tw" id="lt"></div></div>`}
window.drawList=n=>{const c=COLL[n],q=($('lq')?.value||'').toLowerCase(),items=D[n].items;const rows=items.map((x,i)=>[x,i]).filter(([x])=>Object.values(x).some(v=>String(v||'').toLowerCase().includes(q)));
 $('lt').innerHTML=rows.length?`<table><thead><tr>${c.cols.map(k=>`<th>${k[1]}</th>`).join('')}<th></th></tr></thead><tbody>${rows.slice().reverse().map(([x,i])=>`<tr>${c.cols.map(k=>{let v=x[k[0]];if(k[0]==='date')v=v?fd(v):'—';if(k[0]==='unlock')return `<td>${v===undefined||v==='all'?'<span class="tag ok">ALL FEATURES</span>':(v?esc(v.split(',').map(z=>FEATURES[z]||z).join(', ')):'—')}</td>`;if(k[0]==='p')return `<td>${v==='Premium'?'<span class="tag ok">PREMIUM</span>':esc(v||'Default')}</td>`;if(k[0]==='e')return `<td>${x.e?'<span class="tag ok">ATTACHED</span>':'—'}</td>`;if(k[0]==='c'||k[0]==='category')return `<td><span class="tag">${esc(v||'—')}</span></td>`;return `<td>${k===c.cols[0]?'<b>'+esc(v||'—')+'</b>':esc(v||'—')}</td>`}).join('')}<td style="white-space:nowrap"><button class="btn sm" onclick="editItem('${n}',${i})">Edit</button> <button class="btn sm danger" onclick="delItem('${n}',${i})">Delete</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Nothing added yet. Use the Add button above.</div>'};
window.editItem=(n,i)=>{const c=COLL[n],x=i>=0?D[n].items[i]:{};const f=c.fields.map(([k,l,t,req])=>{const v=x[k]??'';let inp;if(t==='area')inp=`<textarea id="f_${k}">${esc(v)}</textarea>`;else if(t==='cat'||t==='sel'){const o=t==='cat'?cats():c.fields.find(z=>z[0]===k)[3];const all=v&&!o.includes(v)?[v,...o]:o;inp=`<select id="f_${k}">${all.map(z=>`<option ${z===v?'selected':''}>${esc(z)}</option>`).join('')}</select>`}else if(t==='feats'){const cur=x[k]===undefined?['all']:String(x[k]).split(','),ks=['all',...FS_SELL];inp=`<input id="f_${k}" type="hidden" value="${esc(x[k]===undefined?'all':x[k])}"><div class="checks" id="ft_${k}">${ks.map(z=>`<label class="check"><input type="checkbox" value="${z}" ${cur.includes('all')||cur.includes(z)?'checked':''} onchange="ftSync('${k}',this)">${esc(z==='all'?'ALL FEATURES':FEATURES[z])}</label>`).join('')}</div>`}else if(t==='img'||t==='pdf'){inp=`<input id="f_${k}" type="text" placeholder="Link appears here after upload" value="${esc(v)}"><input type="file" accept="${t==='img'?'image/*':'application/pdf'}" style="margin-top:6px" onchange="cldUpload(this,'${k}')"><div class="small" id="s_${k}">${t==='img'?'Choose a photo — it uploads to Cloudinary automatically.':'Choose a PDF — it uploads to Cloudinary automatically.'}</div>${t==='img'&&v?`<img id="p_${k}" src="${esc(v)}" style="max-height:90px;margin-top:6px;border-radius:8px">`:`<img id="p_${k}" style="max-height:90px;margin-top:6px;border-radius:8px;display:none">`}`}else inp=`<input id="f_${k}" type="${t==='date'?'date':'text'}" value="${esc(v)}">`;return `<div class="field"><label>${l.toUpperCase()}${req===1?' *':''}</label>${inp}</div>`}).join('');
 modal(`<h3>${i>=0?'Edit':'Add'} ${c.single}</h3>${f}<div class="macts"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveItem('${n}',${i})">SAVE & PUBLISH</button></div>`)};
window.cldUpload=async(inp,k)=>{const f=inp.files[0],st=$('s_'+k);if(!f)return;if(CLD.cloud.startsWith('YOUR_')){st.textContent='Set Cloudinary cloud name and upload preset in the CLD line of this file first.';return}
 const isImg=f.type.startsWith('image/'),isPdf=f.type==='application/pdf';if(inp.accept.startsWith('image')&&!isImg){st.textContent='Please choose an image file (JPG, PNG, WebP).';inp.value='';return}if(inp.accept.includes('pdf')&&!isPdf){st.textContent='Please choose a PDF file.';inp.value='';return}if(f.size>(isImg?10:95)*1024*1024){st.textContent='File too large (max '+(isImg?'10':'95')+' MB).';inp.value='';return}st.textContent='Uploading… please wait';UPLOADING++;
 try{const fd=new FormData();fd.append('file',f);fd.append('upload_preset',CLD.preset);const r=await fetch(`https://api.cloudinary.com/v1_1/${CLD.cloud}/auto/upload`,{method:'POST',body:fd}),j=await r.json();if(!j.secure_url)throw new Error(j.error?.message||'Upload failed');
 $('f_'+k).value=j.secure_url;st.textContent='Uploaded ✓';const p=$('p_'+k);if(p&&f.type.startsWith('image')){p.src=j.secure_url;p.style.display='block'}}catch(e){st.textContent='Upload failed: '+e.message}finally{UPLOADING--}};
window.saveItem=async(n,i)=>{if(UPLOADING)return toast('Upload in progress — please wait until it finishes.');const c=COLL[n],o={};c.fields.forEach(([k])=>o[k]=($('f_'+k)?.value||'').trim());if(!o[c.fields[0][0]])return toast(c.fields[0][1]+' is required.');if(i>=0)D[n].items[i]={...D[n].items[i],...o};else D[n].items.push({id:Date.now().toString(36),...o});if(await persist(n)){closeModal();drawList(n);toast('Saved. Live on website.')}};
window.delItem=async(n,i)=>{if(!confirm('Delete this entry?'))return;D[n].items.splice(i,1);if(await persist(n)){drawList(n);toast('Deleted.')}};
async function persist(n){try{await setDoc(doc(fs,'content',n),{...D[n],updatedAt:Date.now()});return true}catch(e){toast(fbErr(e));return false}}
function pSite(){const b=CFG.brand,t=CFG.theme,q=CFG.quick,a=CFG.assistant;const F=(id,l,v,ty='text')=>`<div class="field"><label>${l}</label><input id="${id}" type="${ty}" value="${esc(v)}"></div>`;
 return head('Website Settings','Branding, theme, features, page names and assistant.',`<button class="btn primary" onclick="saveSite()">SAVE CHANGES</button>`)+`<div class="grid2"><div class="card"><h3>Branding</h3>${F('brandName','WEBSITE NAME',b.name)}${F('brandSub','SUBTITLE',b.subtitle)}<div class="field"><label>DASHBOARD WELCOME</label><textarea id="welcome">${esc(b.welcome)}</textarea></div>${F('accent','ACCENT COLOR',t.accent,'color')}${F('bg','BACKGROUND COLOR',t.background,'color')}</div>

 <div class="card"><h3>Legal Assistant</h3><label class="check"><input id="aOn" type="checkbox" ${a.enabled!==false?'checked':''}>Enable Legal Assistant</label><div class="field"><label>ASSISTANT INTRO</label><textarea id="aIntro">${esc(a.intro)}</textarea></div>${F('qCases','QUICK ACTION — CASES',q.cases)}${F('qDocs','QUICK ACTION — DOCUMENTS',q.documents)}${F('qJud','QUICK ACTION — JUDGMENTS',q.judgments)}${F('qNotes','QUICK ACTION — NOTES',q.notes)}</div></div>`}
window.allF=v=>document.querySelectorAll('[data-feature]').forEach(x=>x.checked=v);
window.saveSite=async()=>{const v=id=>$(id).value.trim();const f={},l={};document.querySelectorAll('[data-feature]').forEach(x=>f[x.dataset.feature]=x.checked);document.querySelectorAll('[data-label]').forEach(x=>{if(x.value.trim())l[x.dataset.label]=x.value.trim()});
 CFG={...CFG,brand:{name:v('brandName'),subtitle:v('brandSub'),welcome:v('welcome')},theme:{accent:$('accent').value,background:$('bg').value},features:f,labels:l,assistant:{enabled:$('aOn').checked,intro:v('aIntro')},quick:{cases:v('qCases'),documents:v('qDocs'),judgments:v('qJud'),notes:v('qNotes')}};
 try{await setDoc(doc(fs,'siteConfig','main'),{...CFG,updatedAt:Date.now()});toast('Saved. Website updated live.')}catch(e){toast(fbErr(e))}};

/* ===== Phone Notifications (FCM via Cloudflare Worker) ===== */
const PUSH_URL='';
const pushUrl=()=>(PUSH_URL||localStorage.getItem('ea_push_url')||'').replace(/\/+$/,'');
function pPush(){const n=U.filter(u=>u.fcmToken).length;
 return head('Notifications','Send a phone notification to all users or to one user.')+`<div class="grid2"><div class="card"><h3>Send Notification</h3>
 <div class="field"><label>SEND TO</label><select id="pm" onchange="pushMode()"><option value="all">All users (${n} phones ready)</option><option value="one">One user</option></select></div>
 <div class="field hidden" id="pone"><label>CHOOSE USER (only users with notification ON)</label><select id="pu">${U.filter(u=>u.fcmToken).map(u=>`<option value="${esc(u.uid)}">${esc(u.name||'User')} — ${esc(u.email||u.mobile||u.loginId||u.uid)}</option>`).join('')||'<option value="">No user is ready yet</option>'}</select></div>
 <div class="field"><label>TITLE</label><input id="pt" maxlength="60" placeholder="e.g. New Law Update"></div>
 <div class="field"><label>MESSAGE</label><textarea id="pb" maxlength="200" placeholder="Write the notification text here…"></textarea></div>
 <button class="btn primary" id="psend" onclick="sendPush()">SEND NOTIFICATION</button><div id="pres" class="small" style="margin-top:12px;min-height:18px"></div></div>
 <div class="card"><h3>Setup</h3><div class="field"><label>WORKER URL (one time)</label><input id="pw" placeholder="https://xxxx.workers.dev" value="${esc(pushUrl())}"></div><button class="btn" onclick="savePushUrl()">SAVE URL</button>
 <p class="small" style="margin-top:12px">A user appears in the list only after installing the latest app, opening it once and tapping <b>Allow</b> on the notification permission. Users: ${U.length} &nbsp;|&nbsp; Notification ON: ${n}</p></div></div>`}
window.drawPush=()=>{};
window.pushMode=()=>{$('pone').classList.toggle('hidden',$('pm').value!=='one')};
window.savePushUrl=()=>{const v=$('pw').value.trim();if(!/^https:\/\//.test(v)){toast('Enter the full https:// Worker URL');return}localStorage.setItem('ea_push_url',v);toast('Worker URL saved')};
window.sendPush=async()=>{const url=pushUrl(),t=$('pt').value.trim(),b=$('pb').value.trim(),mode=$('pm').value,uid=$('pu')?$('pu').value:'';
 if(!url){toast('First save the Worker URL (right side)');return}
 if(!t||!b){toast('Write title and message');return}
 if(mode==='one'&&!uid){toast('Choose a user');return}
 if(!confirm(mode==='all'?'Send this notification to ALL users?':'Send this notification to the selected user?'))return;
 const btn=$('psend'),res=$('pres');btn.disabled=true;res.textContent='Sending…';
 try{const idToken=await auth.currentUser.getIdToken(true);
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({idToken,title:t,body:b,mode,uid})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||('Failed ('+r.status+')'));
  res.textContent='Sent to '+j.sent+' phone(s).';toast('Notification sent');
 }catch(e){res.textContent='Error: '+(e.message||e)}
 btn.disabled=false};

window.savePaySet=async()=>{D.payment={upiId:$('upiId').value.trim(),payeeName:$('upiName').value.trim(),instructions:$('upiNote').value.trim(),rzpApi:$('rzpApi').value.trim(),rzpOn:$('rzpOn').checked,rzpManual:$('rzpManual').checked};if(await persist('payment'))toast('Payment details saved.')};
function pPay(){return head('Payments','Verify UPI payments and activate plans.')+`<div class="card"><div class="tw">${PAY.length?`<table><thead><tr><th>DATE</th><th>USER</th><th>PLAN</th><th>AMOUNT</th><th>UTR</th><th>STATUS</th><th></th></tr></thead><tbody>${PAY.map(p=>`<tr><td>${fd(p.createdAt)}</td><td><b>${esc(p.name||'—')}</b><div class="small">${esc(p.email||'')}</div></td><td>${esc(p.planName)}</td><td>₹${esc(p.amount)}</td><td>${esc(p.utr)}</td><td><span class="tag ${p.status==='approved'?'ok':p.status==='rejected'?'bad':''}">${esc(String(p.status).toUpperCase())}</span></td><td style="white-space:nowrap">${p.status==='pending'?`<button class="btn sm primary" onclick="payAct('${esc(p.id)}',true)">Approve</button> <button class="btn sm danger" onclick="payAct('${esc(p.id)}',false)">Reject</button>`:''}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No payment requests yet.</div>'}</div><div class="note">Check the UTR in your bank/UPI app before approving. Approving activates the plan (or the feature subscription) for the period the user chose.</div></div>`}
window.payAct=async(pid,ok)=>{const p=PAY.find(x=>x.id===pid);if(!p||!confirm((ok?'Approve':'Reject')+' this payment?'))return;try{if(ok){if(p.kind==='feature'){const cur=((SUBS[p.uid]||{}).feats)||{},k=p.featKey;const feats={...cur,[k]:addMonths(Math.max(Date.now(),+cur[k]||0),+p.months||1)};await setDoc(doc(fs,'subscriptions',p.uid),{feats,updatedAt:Date.now()},{merge:true,mergeFields:['feats','updatedAt']});SUBS[p.uid]={...(SUBS[p.uid]||{}),feats}}else{const pl=D.plans.items.find(x=>x.id===p.planId)||D.plans.items.find(x=>x.name===p.planName)||{};const s={planId:p.planId,planName:p.planName,maxCases:pl.maxCases||'',validUntil:Date.now()+(+pl.days||30)*864e5,updatedAt:Date.now()};await setDoc(doc(fs,'subscriptions',p.uid),s,{merge:true});SUBS[p.uid]={...(SUBS[p.uid]||{}),...s}}}await setDoc(doc(fs,'payments',pid),{status:ok?'approved':'rejected',decidedAt:Date.now()},{merge:true});p.status=ok?'approved':'rejected';go('payments');toast(ok?'Approved. Plan activated.':'Rejected.')}catch(e){toast(fbErr(e))}};

/* ===== Feature-wise subscriptions ===== */
const FS_SELL=Object.keys(FEATURES).filter(k=>!['dashboard','profile','settings','plans'].includes(k));
const FS_DUR=[1,3,6,12];
const fsName=k=>k==='all'?'ALL FEATURES BUNDLE':FEATURES[k];
function addMonths(base,m){const d=new Date(base);d.setMonth(d.getMonth()+m);return d.getTime()}
const FS_ICO={assistant:'⚖',cases:'▤',clients:'♙',hearings:'◷',documents:'▣',drafting:'✎',library:'📚',judgments:'◉',updates:'◇',notes:'✎',reports:'▥',charts:'◔',fees:'₹',all:'★'};
window.ftSync=(k,el)=>{const cs=[...$('ft_'+k).querySelectorAll('input')],al=cs.find(c=>c.value==='all');if(el.value==='all')cs.forEach(c=>c.checked=el.checked);else if(!el.checked)al.checked=false;else if(cs.filter(c=>c.value!=='all').every(c=>c.checked))al.checked=true;$('f_'+k).value=al.checked?'all':cs.filter(c=>c.checked).map(c=>c.value).join(',')};
function fsRow(k){const c=(D.featureSub.items||{})[k]||{},durs=c.durs||{},lock=c.lock!==undefined?!!c.lock:!!c.on,all=k==='all';
 const sub=all?'One bundle price that unlocks every locked feature':k==='library'?'Lock every e-book, or only the books you mark Premium':k==='assistant'?'AI Law Assistant chat &amp; drafting':'Locked until the user buys a plan that includes it';
 return `<div class="fsrow${lock||c.on?' hot':''}" data-k="${k}"><div class="fshead"><div class="fsti"><i>${FS_ICO[k]||'◈'}</i><div><b>${esc(fsName(k))}</b><span class="small">${sub}</span></div></div><div class="fsopts">${all?'':`<label class="sw"><input type="checkbox" class="fs-lock" ${lock?'checked':''}><span></span>Premium lock</label>`}<label class="sw"><input type="checkbox" class="fs-on" ${c.on?'checked':''}><span></span>Sell separately</label></div></div>${k==='library'?`<div class="field"><label>WHICH E-BOOKS ARE LOCKED</label><select class="fs-lib"><option value="all" ${c.lib!=='sel'?'selected':''}>All e-books</option><option value="sel" ${c.lib==='sel'?'selected':''}>Only books marked “Premium” in Law Library</option></select></div>`:''}${k==='assistant'?`<div class="field"><label>FREE CHATS BEFORE SUBSCRIPTION (0 = none)</label><input class="fs-free" type="number" min="0" value="${esc(c.free??2)}"></div>`:''}<div class="fsmonthly"><span class="small">₹ per month (for separate sale)</span><input class="fs-monthly" type="number" min="0" value="${esc(c.monthly??'')}" placeholder="e.g. 99"></div><div class="fsdurs">${FS_DUR.map(m=>{const d=durs[m]||{};return `<div class="fsd"><label class="check"><input type="checkbox" class="fs-d" data-m="${m}" ${d.on?'checked':''}>${m} month${m>1?'s':''}</label><input class="fs-p" data-m="${m}" type="number" min="0" value="${esc(d.price??'')}" placeholder="total ₹ (blank = auto)"></div>`}).join('')}</div></div>`}
function pFeat(){const act=[];Object.entries(SUBS).forEach(([uid,s])=>Object.entries(s.feats||{}).forEach(([k,t])=>{if(t>Date.now())act.push({uid,k,t})}));
 const uOpt=U.map(u=>`<option value="${esc(u.uid)}">${esc(u.name||'—')} — ${esc(u.email||u.mobile||u.uid)}</option>`).join('');
 const fOpt=['all',...FS_SELL].map(k=>`<option value="${k}">${esc(fsName(k))}</option>`).join('');
 return head('Premium Access','Choose exactly where the subscription applies — Law Assistant, e-books, or any other feature.',`<button class="btn primary" onclick="saveFeat()">SAVE & PUBLISH</button>`)
 +`<div class="note"><b>How it works:</b> Turn <b>Premium lock</b> ON for every feature that needs a plan (e.g. Law Assistant, Law Library). Users get access through a <b>plan that includes it</b> (set under Plans → “This plan unlocks”) or by buying it separately if you turn on <b>Sell separately</b> and set a monthly price. For e-books choose <b>All e-books</b> or mark individual books <b>Premium</b> in Law Library. Features with the lock OFF stay free.</div>`
 +`<div class="card">${['all',...FS_SELL].map(fsRow).join('')}</div>`
 +`<div class="card"><h3>Give access manually</h3><p class="small">Gift or fix a subscription for any user without a payment.</p><div class="grid2"><div class="field"><label>USER</label><select id="gUser">${uOpt||'<option value="">No users</option>'}</select></div><div class="field"><label>FEATURE</label><select id="gFeat">${fOpt}</select></div></div><div class="field"><label>MONTHS</label><input id="gMonths" type="number" min="1" value="1"></div><button class="btn primary" onclick="grantFeat()">GRANT ACCESS</button></div>`
 +`<div class="card"><h3>Active feature subscribers</h3><div class="tw">${act.length?`<table><thead><tr><th>USER</th><th>FEATURE</th><th>VALID TILL</th><th></th></tr></thead><tbody>${act.map(a=>{const u=U.find(x=>x.uid===a.uid)||{};return `<tr><td><b>${esc(u.name||'—')}</b><div class="small">${esc(u.email||a.uid)}</div></td><td><span class="tag ok">${esc(fsName(a.k)||a.k)}</span></td><td>${fd(a.t)}</td><td><button class="btn sm danger" onclick="revokeFeat('${esc(a.uid)}','${esc(a.k)}')">Revoke</button></td></tr>`}).join('')}</tbody></table>`:'<div class="empty">No active feature subscriptions yet.</div>'}</div></div>`}
window.saveFeat=async()=>{const items={};document.querySelectorAll('.fsrow').forEach(r=>{const k=r.dataset.k,durs={};r.querySelectorAll('.fs-d').forEach(cb=>{const m=cb.dataset.m;durs[m]={on:cb.checked,price:r.querySelector('.fs-p[data-m="'+m+'"]').value.trim()}});const on=r.querySelector('.fs-on').checked,lk=r.querySelector('.fs-lock');items[k]={on,lock:on||(lk?lk.checked:false),lib:(r.querySelector('.fs-lib')||{}).value||'all',free:(r.querySelector('.fs-free')||{value:''}).value.trim(),monthly:r.querySelector('.fs-monthly').value.trim(),durs}});
 for(const k in items){const c=items[k];if(!c.on)continue;const ds=Object.values(c.durs).filter(d=>d.on);if(!ds.length)return toast(fsName(k)+': tick at least one duration.');if(!(+c.monthly>0)&&ds.some(d=>!(+d.price>0)))return toast(fsName(k)+': enter the monthly price (or a total price for each duration).')}
 D.featureSub={items};if(await persist('featureSub'))toast('Saved. Live in the app now.')};
window.grantFeat=async()=>{const uid=$('gUser').value,k=$('gFeat').value,m=+$('gMonths').value||1;if(!uid)return toast('Select a user.');const cur=((SUBS[uid]||{}).feats)||{};const feats={...cur,[k]:addMonths(Math.max(Date.now(),+cur[k]||0),m)};try{await setDoc(doc(fs,'subscriptions',uid),{feats,updatedAt:Date.now()},{merge:true,mergeFields:['feats','updatedAt']});SUBS[uid]={...(SUBS[uid]||{}),feats};go('featsub');toast('Access granted.')}catch(e){toast(fbErr(e))}};
window.revokeFeat=async(uid,k)=>{if(!confirm('Remove this access?'))return;const feats={...(((SUBS[uid]||{}).feats)||{})};delete feats[k];try{await setDoc(doc(fs,'subscriptions',uid),{feats,updatedAt:Date.now()},{merge:true,mergeFields:['feats','updatedAt']});SUBS[uid]={...(SUBS[uid]||{}),feats};go('featsub');toast('Access removed.')}catch(e){toast(fbErr(e))}};
function modal(h){closeModal();document.body.insertAdjacentHTML('beforeend',`<div class="mbk" id="mbk" onmousedown="if(event.target===this)closeModal()"><div class="modal">${h}</div></div>`)}
window.closeModal=()=>{$('mbk')?.remove()};
Object.assign(window,{login,logout,go});
</script></body></html>
